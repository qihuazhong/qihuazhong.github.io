# a summary about you
summary: '我从头到尾构建数据和 AI 系统：采集数据、建模、部署，并检查输出是否正确。2025 年起我独立工作，开发并运营 GPU PRIX（gpuprix.com），一个日独立访客 1,200+ 的 GPU 规格与价格比较网站，包括它的数据采集流程，以及负责翻译内容和检查商品信息的大模型工作流。我还搭建了处理大规模加密货币市场数据的管道，并在其上构建了预测模型。在此之前：在蒙特利尔高等商学院（HEC Montréal）攻读博士（ABD），研究深度强化学习在库存管理中的应用；以及在蒙特利尔从事三年需求预测与计划工作。'

