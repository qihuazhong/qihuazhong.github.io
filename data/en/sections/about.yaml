# a summary about you
summary: 'I build data and AI systems end to end: collecting the data, modeling, deploying, and checking that the output is right. Since 2025 I have worked independently. I built and run GPU PRIX (gpuprix.com), a GPU spec and price comparison site with 1,200+ daily unique visitors, including its data collection pipelines and the LLM workflows that translate its content and check its product listings. I also built pipelines for high-volume crypto market data and forecasting models on top of them. Before that: doctoral studies (ABD) at HEC Montréal on deep reinforcement learning for inventory, and three years of demand forecasting and planning in Montreal.'

