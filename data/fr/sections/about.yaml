# a summary about you
summary: "Je conçois des systèmes de données et d'IA de bout en bout : collecte des données, modélisation, déploiement et vérification des résultats. Depuis 2025, je travaille de façon indépendante. J'ai développé et j'exploite GPU PRIX (gpuprix.com), un site de comparaison de caractéristiques et de prix de GPU qui compte plus de 1 200 visiteurs uniques par jour, y compris ses pipelines de collecte de données et les flux LLM qui traduisent son contenu et vérifient ses fiches produits. J'ai aussi construit des pipelines de données de marché crypto à haut volume et des modèles de prévision sur ces données. Auparavant : études doctorales (ABD) à HEC Montréal sur l'apprentissage par renforcement profond appliqué aux stocks, et trois ans en prévision de la demande et planification à Montréal."

