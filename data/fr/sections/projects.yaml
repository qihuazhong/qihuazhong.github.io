  logo: /images/sections/projects/snim.png
  # role: 🥇 Médaille d’or en solo
  # timeline: "May 2022"
  repo: https://github.com/qihuazhong/multi-echelon-drl # If your project is a public repo on GitHub, then provide this link. it will show star count.
  url: ""  # If your project is not a public repo but it has a website or any external details url then provide it here. don't provide "repo" and "url" simultaneously.
  summary: Recherche doctorale appliquant l'apprentissage par renforcement profond à l'optimisation des stocks multi-échelons; conçu un environnement de simulation et entraîné des agents TD3, A2C et DQN (Stable Baselines3, PyTorch) pour prendre les décisions de stock. Voir ma [▶️présentation](https://www.youtube.com/watch?v=x_4i7ULuoew&list=LL&index=5) à IVADO Digital October.
