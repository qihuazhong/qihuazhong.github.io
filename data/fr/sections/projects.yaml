- name: GPU PRIX
  logo: /images/site/main-logo.png
  role: Développeur indépendant
  timeline: "2025 - aujourd’hui"
  url: "https://gpuprix.com"
  summary: "Site de comparaison de caractéristiques et de prix de GPU, plus de 1 200 visiteurs uniques par jour. J'ai conçu ses pipelines de collecte de données automatisés, un flux de localisation LLM (un modèle de pointe rédige le contenu, un modèle local le traduit, des vérifications automatiques rejettent les mauvais résultats) et un agent LLM planifié (LangGraph, API Claude) qui vérifie que les annonces collectées sont associées au bon GPU."
  tags: ["#independent", "#LLM", "#data-pipelines"]

