  - designation: Scientifique de données et ingénieur IA indépendant
    start: January 2025
    # no end date: shown as "Present"
    responsibilities:
    - "Développe et exploite GPU PRIX (gpuprix.com), un site de comparaison de caractéristiques et de prix de GPU (Next.js, React, TypeScript, AWS EC2) avec des pipelines de collecte de données automatisés; l'a fait croître à plus de 1 200 visiteurs uniques par jour en analysant le trafic pour repérer des marchés mal desservis et s'y étendre."
    - "Conçu un flux de localisation multi-agents : un agent LLM de pointe rédige le contenu en anglais et délègue la traduction à un modèle local spécialisé (servi avec llama.cpp), avec des vérifications automatiques de longueur, de glossaire, de chiffres et de code qui rejettent une mauvaise traduction et demandent une révision."
    - "Conçu un agent LLM planifié (LangGraph, API Claude) qui vérifie que chaque annonce collectée est associée au bon GPU, puis la reclasse ou la retire en cas d'erreur, avec des plafonds de dépenses, un mode révision seule et un jeu de test de précision qui encadrent toute modification des données en production."
    - "Conçu des pipelines à faible latence traitant plusieurs Go par jour de données de transactions et de carnets d'ordres en temps réel provenant de plusieurs plateformes; entraîné des modèles LightGBM quantiles multi-cibles de la volatilité et des rendements à court terme."
    - "Construit des cartes de risque de liquidation à partir des positions par compte (nœud blockchain auto-hébergé), montrant les niveaux de prix auxquels les positions à effet de levier seraient liquidées."
    - "Conçu des services REST et WebSocket (Python/FastAPI) pour découpler l'ingestion des données et l'ingénierie des variables de l'entraînement, de l'inférence et de l'exécution."

